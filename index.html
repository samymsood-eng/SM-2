<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="color-scheme" content="light dark" />
    <title>SM+2 - المنصة الرسمية للبرمجيات والمطورين</title>
    <meta name="description" content="المنصة الرسمية لبرمجيات SM+2 - تنزيل مباشر، متجر المنتجات والمبيعات، ودعم المطورين مع لوحة تحكم إدارية وتكامل GitHub." />
    <meta property="og:title" content="SM+2 - المنصة الرسمية للبرمجيات والمطورين" />
    <meta property="og:description" content="المنصة الرسمية لبرمجيات SM+2 - تنزيل مباشر، متجر المنتجات والمبيعات، ودعم المطورين مع لوحة تحكم إدارية وتكامل GitHub." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Cinzel:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('sm2_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 antialiased selection:bg-amber-500/20 selection:text-amber-900 dark:selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
