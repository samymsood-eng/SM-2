    <meta name="theme-color" content="#fafafa" id="meta-theme-color" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sm2_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || (!saved && prefersDark) ? 'dark' : 'light';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
          var metaCs = document.getElementById('meta-color-scheme');
          if (metaCs) metaCs.setAttribute('content', theme);
          var metaTc = document.getElementById('meta-theme-color');
          if (metaTc) metaTc.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#fafafa');
        } catch (e) {}
      })();
    </script>
